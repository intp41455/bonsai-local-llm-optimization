      </g>
      <animateTransform attributeName="transform" type="rotate" from="0 120 210" to="360 120 210" dur="0.5s" repeatCount="indefinite"/>
    </g>
    <g id="wheelR">
      <circle cx="260" cy="210" r="30" fill="none" stroke="#222222" stroke-width="5"/>
      <circle cx="260" cy="210" r="3" fill="#222222"/>
